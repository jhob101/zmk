description: Sticky key behavior

compatible: "zmk,behavior-sticky-key"

include: one_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  release-after-ms:
    type: int
    required: true
  quick-release:
    type: boolean
  ignore-modifiers:
    type: boolean
  cancel-on-retap:
    type: boolean
    description: |
      Tapping the key again while it is armed and unused disarms it, instead
      of arming it afresh.
  release-on-mouse:
    type: boolean
    description: |
      A mouse click or a trackpad scroll uses up the armed key, as a key press
      does. Without this, only key presses use it up.
